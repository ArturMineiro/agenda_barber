services:
  db:
    image: postgres:16-alpine
    container_name: navalha_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: navalha
      POSTGRES_PASSWORD: navalha
      POSTGRES_DB: navalha
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
