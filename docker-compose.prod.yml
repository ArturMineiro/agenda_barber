# Produção (VPS): docker compose -f docker-compose.prod.yml up -d --build
# Os segredos vêm do .env ao lado deste arquivo (só existe no servidor; veja deploy/env.production.example).
name: navalha

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: navalha
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      POSTGRES_DB: navalha
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navalha"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://navalha:${DB_PASSWORD}@db:5432/navalha?schema=public
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      WEB_URL: ${APP_URL:?defina APP_URL no .env}
      BILLING_GRACE_DAYS: ${BILLING_GRACE_DAYS:-5}
      # nginx da VPS + nginx do container
      TRUST_PROXY: 2
      SUPPORT_WHATSAPP: ${SUPPORT_WHATSAPP:-21967355884}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    volumes:
      # imagens enviadas (logo, capa, fotos) sobrevivem aos deploys
      - uploads:/app/backend/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3333/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: prod
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # só o nginx da VPS acessa; ele cuida do domínio e do HTTPS
      - "${WEB_PORT:-127.0.0.1:8083}:80"

volumes:
  pgdata:
  uploads:
