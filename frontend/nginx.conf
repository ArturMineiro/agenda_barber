# Robôs que montam a prévia do link (WhatsApp, Instagram/Facebook, Telegram, X, LinkedIn, Discord, Slack, iMessage)
map $http_user_agent $is_link_preview_bot {
  default 0;
  ~*(whatsapp|facebookexternalhit|facebot|meta-externalagent|telegrambot|twitterbot|linkedinbot|discordbot|slackbot|skypeuripreview|pinterest|applebot|redditbot|embedly|vkshare) 1;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # upload de imagens (o navegador já reduz antes; o servidor aceita até 8 MB)
  client_max_body_size 10m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # API e imagens no mesmo domínio: o cookie de sessão funciona sem CORS
  location ~ ^/(api|uploads)/ {
    proxy_pass http://api:3333;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # o nginx da VPS já recebeu em HTTPS; repassa o protocolo original
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # arquivos com hash no nome podem ficar em cache por muito tempo
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html sempre atualizado, para cada deploy aparecer na hora
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA: /painel, /barbearia-do-ze... caem no index.html
  location / {
    # robô de prévia: devolve título, descrição e imagem da página (ex.: card da barbearia)
    if ($is_link_preview_bot) {
      rewrite ^(.*)$ /api/og/meta?path=$1 last;
    }
    try_files $uri $uri/ /index.html;
  }
}
