# /etc/nginx/sites-available/navalha (link em sites-enabled).
# HTTPS: certbot --nginx -d navalha.forgedevapps.com (o certbot acrescenta o bloco 443 e o redirecionamento).
server {
  listen 80;
  listen [::]:80;
  server_name navalha.forgedevapps.com;

  # upload de imagens
  client_max_body_size 10m;

  location / {
    proxy_pass http://127.0.0.1:8083;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
